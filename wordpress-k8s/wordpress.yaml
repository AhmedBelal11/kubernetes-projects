apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress-deployment
  labels:
    app: wordpress-lb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wordpress-lb
  template:
    metadata:
      labels:
        app: wordpress-lb
    spec:
      containers:
        - name: wordpress-container
          image: wordpress
          ports:
            - containerPort: 80
          env:
            - name: WORDPRESS_DB_HOST
              value: "mysql-service"

            - name: WORDPRESS_DB_USER
              value: "wordpress"

            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wordpress-secret
                  key: mysql-user-password

            - name: WORDPRESS_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: wordpress-secret
                  key: mysql-database-name

---
apiVersion: v1
kind: Service
metadata:
  name: wordpress-service
spec:
  type: LoadBalancer
  selector:
    app: wordpress-lb
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80